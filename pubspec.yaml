name: cloud_helper
description: A Flutter project for working with iCloud.
version: 1.0.1
homepage: https://github.com/Progressive-Mobile/icloud_helper

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: CloudHelperPlugin
      macos:
        pluginClass: CloudHelperPlugin
